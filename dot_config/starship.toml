# https://starship.rs/config/
# fredericrous

# Modules that report a toolchain version do it by *running* that toolchain
# (`node --version`, `go version`, ...). A cold Homebrew `node` — first terminal
# after a boot, page cache empty, Gatekeeper re-verifying a ~100MB binary — can
# take well over a second, which tripped the old 1000ms cap and printed:
#
#   [WARN] - (starship::utils): Executing command "/opt/homebrew/bin/node" timed out.
#
# Timing out is the worst outcome: the prompt still paid the full wait and then
# threw the result away. 2000ms lets the cold spawn finish and render.
#
# If you would rather have an instantly-drawn prompt than a Node version, the
# real fix is to not spawn node at all — see [nodejs] below.
command_timeout = 2000
right_format = """$time"""

[time]
disabled = true
style = "#939594"
format = "[$time]($style)"

[aws]
style = "bg:#f9a600 fg:black"
symbol = "☁ "
format = "[](fg:black bg:#f9a600)[ $symbol$profile]($style)[](fg:#f9a600 bg:black)"

[character]
success_symbol = "[❯](#ff9400)"
error_symbol = "[✗](#ff4b00)"

[cmd_duration]
style = "#f9a600"
format = "[](fg:black bg:#f9a600)[󰄉 $duration](bg:$style fg:black)[](fg:$style)"

[directory]
style = "#c05303"
truncate_to_repo = false
fish_style_pwd_dir_length = 1
format = "[](fg:black bg:#c05303)[ $path[$read_only](bg:$style fg:black)](bg:$style fg:black)[](fg:$style)"
read_only = " "

[docker_context]
style = "fg:black bg:#eb9606"
symbol = "🐳  "
format = "[](fg:black bg:#eb9606)[ $symbol$context]($style)[](fg:#eb9606)"

[git_branch]
symbol = " "
style = "#d8712c"
format = "[](fg:black bg:$style)[$symbol$branch](fg:black bg:$style)[](fg:$style)"

[git_commit]
style = "#d8712c"
format = "\b[ ](bg:$style)[\\($hash$tag\\)](fg:black bg:$style)[](fg:$style)"

[git_state]
style = "#d8712c"
format = "\b[ ](bg:$style)[ \\($state( $progress_current/$progress_total)\\)](fg:black bg:$style)[](fg:$style)"

[git_status]
style = "#d8712c"
format = "(\b[ ](bg:$style fg:black)$conflicted$staged$modified$renamed$deleted$untracked$stashed$ahead_behind[](fg:$style))"
conflicted = "[ ](bold fg:88 bg:#d8712c)[  ${count} ](fg:black bg:#d8712c)"
staged = "[ $count ](fg:black bg:#d8712c)"
modified = "[ ${count} ](fg:black bg:#d8712c)"
renamed = "[ ${count} ](fg:black bg:#d8712c)"
deleted = "[ ${count} ](fg:black bg:#d8712c)"
untracked = "[?${count} ](fg:black bg:#d8712c)"
stashed = "[ ${count} ](fg:black bg:#d8712c)"
ahead = "[ ${count} ](fg:#523333 bg:#d8712c)"
behind = "[ ${count} ](fg:black bg:#d8712c)"
diverged = "[ ](fg:88 bg:#d8712c)[ נּ ](fg:black bg:#d8712c)[ ${ahead_count} ](fg:black bg:#d8712c)[ ${behind_count} ](fg:black bg:#d8712c)"

[golang]
symbol = ""
style = "fg:black bg:#eb9606"
format = "[](fg:black bg:#eb9606)[ $symbol$version]($style)[](fg:#eb9606)"

[helm]
style = "fg:black bg:#eb9606"
format = "[](fg:black bg:#eb9606)[ $symbol($version)]($style)[](fg:#eb9606)"

[java]
symbol = " "
style = "fg:black bg:#eb9606"
format = "[](fg:black bg:#eb9606)[ $symbol$version]($style)[](fg:#eb9606)"

[kotlin]
style = "fg:black bg:#eb9606"
format = "[](fg:black bg:#eb9606)[ $symbol$version]($style)[](fg:#eb9606)"

[kubernetes]
format = "[](fg:black bg:#ad4007)[ $symbol$context](fg:black bg:#ad4007)[](fg:#ad4007)"
disabled = false

#[memory_usage]
#style = "#f9a600"
#symbol = " "
#format = "[](fg:black bg:#f9a600)[$symbol$ram](bg:$style fg:black)[](fg:$style)"
#threshold = 95
#disabled = false

[nodejs]
style = "green"
format = "[](fg:black bg:#eb9606)[󰎙 $symbol($version)](fg:black bg:#eb9606)[](fg:#eb9606)"
# By default this module also fires on a bare *.js/*.ts/*.mjs/... file, so any
# directory holding one stray script pays for a `node --version` spawn. Limit
# the trigger to markers that mean "this is actually a Node project"; real
# projects all have one. Set `disabled = true` here to never spawn node at all.
detect_extensions = []
detect_files = ["package.json", ".node-version", ".nvmrc"]
detect_folders = ["node_modules"]

[ocaml]
style = "fg:black bg:#eb9606"
format = "[](fg:black bg:#eb9606)[$symbol$version]($style)[](fg:#eb9606)"

[package]
disabled = true

[php]
symbol = " "
style = "fg:black bg:#eb9606"
format = "[](fg:black bg:#eb9606)[$symbol$version]($style)[](fg:#eb9606)"

[python]
